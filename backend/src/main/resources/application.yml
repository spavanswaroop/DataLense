server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: datalens-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:datalens}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

datalens:
  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:8000/internal/v1}
  storage:
    upload-path: ${STORAGE_UPLOAD_PATH:../storage/uploads}
    processed-path: ${STORAGE_PROCESSED_PATH:../storage/processed}
    models-path: ${STORAGE_MODELS_PATH:../storage/models}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000

